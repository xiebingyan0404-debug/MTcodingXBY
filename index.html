ion>中件 · 可手提</option><option>较重 · 请提前确认</option></select>'}</div></div><div class="field"><label for="pubDesc">${book?'版本、成色与交接说明':'补充说明'} <small>公开信息中不要填写手机号、取件码或房间号</small></label><textarea id="pubDesc" name="desc" required maxlength="500" placeholder="${tea?'写清店铺、商品价格、优惠规则、糖冰备注和交接约定。':'写清物品、时间与交接约定，让同学更好判断能否帮忙。'}"></textarea></div>${book?'':`<div class="field"><label>感谢方式 <small>由你自主决定，不强制付费</small></label><div class="choice-row">${[['free','🌱 无偿互助'],['cash','💰 跑腿费'],['treat','🥤 请喝饮料']].map(([v,l])=>`<button type="button" class="${payChoice===v?'active':''}" data-action="payChoice" data-value="${v}">${l}</button>`).join('')}</div><div id="feeField" class="hidden" style="margin-top:10px"><input name="fee" aria-label="跑腿费金额" disabled type="number" min="0.5" max="100" step="0.5" placeholder="填写跑腿费（元），与商品费用分开"><div class="form-hint">个人自主定价，接单前双方确认；平台不抽成。</div></div></div>`}<div class="form-grid"><div class="field"><label for="pubGoods">${book?'书籍售价（元）':tea?'每人预计商品费用（元）':'需另付的商品费用（元）'}</label><input id="pubGoods" type="number" name="goods" min="0" max="500" step="0.1" value="${tea?16:0}" required><small style="font-size:10px">${book?'填0表示免费赠送。':'填0表示已支付或无需商品费用。'}</small></div><div class="field"><label for="pubPayer">费用与结算约定</label><select name="payer" id="pubPayer">${(book?['当面检查书况后，自行结算书款','免费赠送，不收费用']:tea?['发起人统一下单，交接时按实际商品金额结算','参与者自行下单付款，发起人顺路带回']:['商品已由发布者支付','请自行提前支付商品费用','商品按实际订单金额，交接时自行结算']).map(v=>`<option>${v}</option>`).join('')}</select></div></div><div class="notice yellow">当面交接、自行结算。平台不经手资金、不提供资金担保。商品费用与跑腿费分别确认，礼物仅用于表达感谢。</div><div id="publishError" class="error" role="alert"></div><div class="modal-foot"><button class="primary full" type="submit">${offer?'发布顺路，一起出发 ↗':'发布互助，喊一声谁顺路 ＋'}</button></div></form>`)}
function submitPublish(form){const d=new FormData(form),from=d.get('from'),to=d.get('to'),title=d.get('title').trim(),desc=d.get('desc').trim(),fee=Number(d.get('fee')),goods=Number(d.get('goods'));if(!title||!desc){$('#publishError').textContent='请填写标题和补充说明。';return}if(from===to&&publishCat!=='book'){$('#publishError').textContent='出发地和送达地不能相同，请选择另一地点。';return}if(payChoice==='cash'&&publishCat!=='book'&&(!fee||fee<.5||fee>100)){$('#publishError').textContent='请填写0.5至100元的跑腿费。';return}if(goods<0||goods>500){$('#publishError').textContent='请填写0至500元的商品费用。';return}const hasCap=publishCat==='tea'||publishDir==='offer';let t={id:'local'+Date.now(),owner:'me',cat:publishCat,dir:publishDir,title,from,to,end:Date.now()+Number(d.get('minutes'))*60000,created:Date.now(),pay:publishCat==='book'?'free':payChoice,fee:payChoice==='cash'?fee:0,goods,payer:d.get('payer'),desc,size:d.get('size')||'轻装顺路',status:'open'};if(hasCap){t.cap=Math.max(1,Math.min(8,Number(d.get('capacity'))||2));t.joins=[];t.size='可加入'+t.cap+'位'}if(editingId){const old=taskFor(editingId);t.id=old.id;t.created=old.created;if(old.joins)t.joins=old.joins;t.cap=Math.max(t.cap||0,t.joins?.length||0)||undefined;S.tasks[S.tasks.findIndex(x=>x.id===editingId)]=t;addMessage(t.id,'system','发布者更新了未接单的互助信息。');editingId=null}else{S.tasks.unshift(t);S.messages[t.id]=[{who:'system',text:'互助已发布。请在接单后交换具体交接信息。'}]}persist();direction=t.dir;category='all';resetFilters();close();nav('home');toast('发布成功！你的互助已经出现在广场。');openTask(t.id)}
function progress(t){const s=effectiveStatus(t),idx={open:0,accepted:1,delivered:2,completed:3}[s]??-1;return `<div class="steps">${['已发布','已接单','待确认','已完成'].map((n,i)=>`<div class="step ${i<=idx?'done':''}"><span>${i<idx?'✓':i+1}</span>${n}</div>`).join('')}</div>`}
function taskActions(t){const status=effectiveStatus(t);if(status==='expired')return'<div class="notice">这份互助已截止，无法继续接单或加入。</div>';if(status==='cancelled')return`<div class="notice">任务已取消。${esc(t.cancelReason||'')}</div>`;if(status==='open'){if(t.owner==='me')return`<div class="notice">等待同学回应。接单后，在任务聊天中确认交接细节。</div><div class="modal-foot"><button class="secondary" data-action="editTask" data-id="${t.id}">编辑帖子</button><button class="primary" data-action="chat" data-id="${t.id}">查看留言</button><button class="secondary" data-action="cancelTask" data-id="${t.id}">取消发布</button>${t.cap&&(t.joins||[]).length?`<button class="secondary" data-action="startGroup" data-id="${t.id}">结束招募，开始交接</button>`:''}<button class="textbtn" data-action="demoAccept" data-id="${t.id}">演示：模拟同学${t.cap?'加入':'接单'}</button></div>`;if(joined(t))return`<div class="notice">✓ 你已加入，等待发起人确认交接。可在消息中沟通。</div><div class="modal-foot"><button class="primary" data-action="chat" data-id="${t.id}">联系发起人</button><button class="secondary" data-action="leave" data-id="${t.id}">退出本次参与</button><button class="textbtn" data-action="demoStart" data-id="${t.id}">演示：模拟发起人开始交接</button></div>`;return `<div class="modal-foot"><button class="primary" data-action="acceptPrompt" data-id="${t.id}">${actionLabel(t)} ↗</button><button class="secondary" data-action="chat" data-id="${t.id}">先问一问</button></div>`}
if(status==='accepted')return`<div class="notice">${t.owner==='me'?'同学正在帮你完成这份互助。':'已接单／参与，请与同学确认后再出发。'}</div><div class="modal-foot"><button class="primary" data-action="chat" data-id="${t.id}">沟通交接</button>${t.runner==='me'||t.owner==='me'&&(t.dir==='offer'||t.cat==='tea')?`<button class="secondary" data-action="deliver" data-id="${t.id}">标记已送达／交接</button>`:`<button class="textbtn" data-action="demoDeliver" data-id="${t.id}">演示：模拟对方已送达</button>`}<button class="textbtn" data-action="cancelTask" data-id="${t.id}">申请取消</button></div>`;
if(status==='delivered'){const confirmer=t.owner==='me'&&t.dir==='need'&&t.cat!=='tea'||joined(t);return`<div class="notice">${confirmer?'同学已送达，请确认收到物品后再完成任务。':'已标记送达，等待对方确认收到物品。'}</div><div class="modal-foot">${confirmer?`<button class="primary" data-action="complete" data-id="${t.id}">确认收到，完成互助 ✓</button>`:`<button class="secondary" data-action="demoComplete" data-id="${t.id}">演示：模拟对方确认完成</button>`}<button class="secondary" data-action="chat" data-id="${t.id}">沟通交接</button><button class="textbtn" data-action="report" data-id="${t.id}">交接遇到问题</button></div>`}
return`<div class="notice">✓ 双方已完成交接。小事一件，帮了大忙。</div><div class="modal-foot">${S.sentGifts.includes(t.id)?'<span class="badge">✓ 已送出感谢</span>':`<button class="primary" data-action="gift" data-id="${t.id}">🎁 送一份感谢</button>`}<button class="secondary" data-action="chat" data-id="${t.id}">查看沟通记录</button>${!S.receivedTasks.includes(t.id)?`<button class="textbtn" data-action="demoGift" data-id="${t.id}">演示：体验收到感谢</button>`:''}</div>`}
function openTask(id){const t=taskFor(id);if(!t)return;activeTask=id;const p=person(t.owner),slots=t.cap?`<div class="notice" style="margin-top:15px">${t.cat==='tea'?'🧋 拼单':'↗ 顺路'}名额 ${(t.joins||[]).length}/${t.cap} · 还可加入 ${Math.max(0,t.cap-(t.joins||[]).length)} 位${(t.joins||[]).length?'<br>'+t.joins.map(j=>`${esc(j.id==='me'?S.user.name:person(j.id).name)}：${esc(j.text)}`).join('<br>'):''}</div>`:'';show('互助详情',`<div style="display:flex;justify-content:space-between"><span class="tag ${t.cat}">${CATS[t.cat].emoji} ${CATS[t.cat].name}${t.dir==='offer'?' · 我正好顺路':''}</span><span class="badge">${statusName(t)}</span></div><h3 class="detail-title">${esc(t.title)}</h3><div class="detail-meta"><span>◷ ${new Date(t.end).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})} ${clock(t.end)}前</span><span>${deadline(t)}</span><span>${esc(t.size)}</span></div>${taskRoute(t)}${slots}<h3>这份小忙</h3><p class="detail-description">${esc(t.desc)}</p><h3>费用说清楚</h3><div class="pay-row"><span>${t.cat==='book'?'书款':'预计商品费用'}</span><strong>${t.goods?'¥'+t.goods+(t.cat==='tea'?' / 人起':''):'已支付／无需另付'}</strong></div>${t.cat!=='book'?`<div class="pay-row"><span>跑腿感谢</span><strong>${t.pay==='cash'?'¥'+t.fee:t.pay==='treat'?'请喝一瓶饮料':'无偿互助'}</strong></div>`:''}<p class="muted" style="font-size:11px;margin:10px 0">${esc(t.payer)}。${t.cat==='tea'?'拼单商品金额以实际订单为准，优惠按约定均摊。':''}</p><div class="notice yellow">当面交接，自行结算。平台不经手资金、不提供资金担保；请勿公开取件码或提前向陌生人支付大额款项。</div><div class="detail-person"><span class="avatar">${p.avatar}</span><div><strong style="font-size:12px">${esc(p.name)} ${gift(p.equip).emoji}</strong><div class="muted" style="font-size:10px">完成${p.done}次互助 · 校园身份（演示）</div></div><button class="textbtn" data-action="person" data-id="${t.owner}">看看TA →</button></div>${progress(t)}${taskActions(t)}`)}
function acceptPrompt(id){const t=taskFor(id);if(!t||effectiveStatus(t)!=='open')return openTask(id);if(t.cap&&(t.joins||[]).length>=t.cap){toast('名额已满，看看其他互助吧。');return}show(t.cat==='tea'?'加入这份拼单':t.dir==='offer'?'搭个顺风':t.cat==='book'?'预约旧书交接':'接下这份小忙',`<h3 style="margin:0 0 13px">${esc(t.title)}</h3>${taskRoute(t)}<div style="margin:15px 0">${reward(t)}</div><form id="acceptForm" data-id="${t.id}"><div class="field"><label for="acceptNote">${t.cat==='tea'?'饮品名称、糖冰与数量':t.dir==='offer'?'物品及交接备注':'交接备注'}</label><textarea id="acceptNote" name="note" required maxlength="200" placeholder="${t.cat==='tea'?'例如：茉莉奶绿1杯，三分糖去冰。图书馆门口见。':'例如：我会按时到，到了在这里联系。'}"></textarea></div><div class="notice">${esc(t.payer)}。${t.goods?'预计商品费用 ¥'+t.goods+'，与跑腿费分开结算。':''}<br>接下前，请确认时间、路线和费用都合适。</div><label style="display:flex;align-items:flex-start;gap:7px;font-size:11px;margin-top:16px"><input type="checkbox" required name="agree" style="margin-top:4px">我已确认交接约定和费用，将按约完成并尊重同学隐私。</label><div class="modal-foot"><button class="primary" type="submit">确认${t.cat==='tea'?'加入':t.dir==='offer'?'搭顺风':t.cat==='book'?'预约':'接单'} ✓</button><button type="button" class="secondary" data-action="detail" data-id="${t.id}">再看看</button></div></form>`)}
function addMessage(id,who,text){if(!S.messages[id])S.messages[id]=[];S.messages[id].push({who,text,at:Date.now()})}
function notify(text,id){S.notices.unshift({text,id,at:Date.now()});S.notices=S.notices.slice(0,20)}
function acceptSubmit(form){const id=form.dataset.id,t=taskFor(id);if(!t||effectiveStatus(t)!=='open')return openTask(id);const note=new FormData(form).get('note').trim();if(!note)return;if(t.cap){if((t.joins||[]).length>=t.cap){toast('名额已满');return}if(joined(t)){openTask(id);return}t.joins.push({id:'me',text:note});if(t.joins.length>=t.cap)t.status='accepted'}else{t.runner='me';t.status='accepted'}addMessage(id,'system',t.cap?'你已加入这份互助。':'你已接下这份互助。');addMessage(id,'me',note);notify(t.cap?'你加入了一份互助':'你接下了一份互助',id);persist();renderCurrent();openTask(id);toast(t.cap?'加入成功，记得和同学确认交接。':'接单成功！这一路，有你搭把手。')}
function transition(id,status,simulated=false){const t=taskFor(id);if(!t)return;const prev=t.status;if(status==='delivered'&&prev!=='accepted'||status==='completed'&&prev!=='delivered')return;if(status==='accepted'&&prev!=='open')return;t.status=status;if(status==='completed'){if(isMine(t))S.user.done++;t.completedAt=Date.now()}addMessage(id,'system',(simulated?'【演示】':'')+({accepted:'已结束招募，开始交接。',delivered:'物品已送达，等待确认。',completed:'双方确认完成互助，可以赠送感谢。'})[status]);notify(statusName(t)+'：'+t.title,id);persist();renderCurrent();openTask(id);toast(status==='completed'?'互助完成！送份感谢，让好意被记住。':status==='delivered'?'已标记送达，等待对方确认。':'开始交接啦！')}
function openGift(id){const t=taskFor(id);if(!t||t.status!=='completed'||S.sentGifts.includes(id))return;chosenGift='sun';show('送出一份有故事的感谢',`<p class="muted" style="font-size:12px">因为「${esc(t.title)}」<br>一份礼物，一句真心话。</p><div class="gift-picker">${GIFTS.map(g=>`<button class="${g.id===chosenGift?'active':''}" data-action="chooseGift" data-id="${g.id}"><em>${g.emoji}</em>${g.name}<br><small>${g.label}</small></button>`).join('')}</div><form id="giftForm" data-id="${id}"><div class="field"><label for="giftText">想对同学说的话</label><textarea name="text" id="giftText" maxlength="200" required placeholder="哪件小事，让你想把这份礼物送给TA？"></textarea></div><p class="muted" style="font-size:10px">每笔完成的互助可送出一份感谢。礼物不能购买、交易或抵扣费用。</p><div class="modal-foot"><button type="submit" class="primary full">送出感谢，让好意被看见 🎁</button></div></form>`)}
function giftSubmit(form){const id=form.dataset.id,t=taskFor(id),text=new FormData(form).get('text').trim();if(!t||t.status!=='completed'||S.sentGifts.includes(id)||!text)return;S.sentGifts.push(id);const target=t.owner==='me'?(t.runner||t.joins?.[0]?.id||'cat'):t.owner;t.giftSent={gift:chosenGift,text,to:target};addMessage(id,'me',`送出${gift(chosenGift).emoji}「${gift(chosenGift).name}」：${text}`);persist();renderCurrent();openTask(id);toast('感谢已送出！这份小事被认真记住了。')}
function receiveGift(id){const t=taskFor(id);if(!t||t.status!=='completed'||S.receivedTasks.includes(id))return;const g='shield';S.receivedTasks.push(id);S.user.gifts[g]=(S.user.gifts[g]||0)+1;const from=t.owner==='me'?(t.runner||t.joins?.[0]?.id||'cat'):t.owner;S.reviews.unshift({from,gift:g,text:'交接很仔细，沟通也很顺畅。谢谢你一起完成这份互助！',task:t.title,at:Date.now()});addMessage(id,'system','【演示】对方送来了一份「靠谱小盾牌」。');notify('你收到了一份靠谱小盾牌',id);persist();renderCurrent();show('收到一份感谢！',`<div style="text-align:center;padding:18px 0"><div class="spark pop" style="font-size:80px">🛡️</div><h3 style="font-size:21px">靠谱小盾牌 ＋1</h3><p class="muted" style="font-size:12px;margin-top:12px">“交接很仔细，沟通也很顺畅。”</p><p class="muted" style="font-size:10px;margin-top:8px">此处为模拟对方赠礼，用于体验双向评价。</p><div class="modal-foot"><button class="primary full" data-action="myGifts">挂到我的主页 →</button></div></div>`)}
function openPerson(id){const p=person(id),reviews=id==='me'?S.reviews:[...S.tasks.filter(t=>t.giftSent?.to===id).map(t=>({from:'me',gift:t.giftSent.gift,text:t.giftSent.text,task:t.title,at:t.completedAt||Date.now()})),{from:'leaf',gift:p.equip,text:'交接顺利，沟通很耐心，感谢同学！',task:'一次校园顺路互助',at:Date.now()-86400000}];show('同学的互助主页',`<div style="text-align:center;padding:5px 0 19px"><span class="avatar big">${p.avatar}</span><h3 style="font-size:21px;margin:10px 0 4px">${esc(p.name)} ${gift(p.equip).emoji}</h3><span class="badge">✓ 校园身份 · 演示</span><p class="muted" style="font-size:11px;margin:9px 0">${esc(S.school)} · 半匿名交流，信用持续积累</p></div><div class="statgrid"><div><strong>${p.done}</strong><span>完成互助</span></div><div><strong>${Object.values(p.gifts).reduce((a,b)=>a+b,0)}</strong><span>收到感谢</span></div><div><strong>${p.done>=10?'🏅':'🌱'}</strong><span>${p.done>=10?'十次搭把手':'互助新芽'}</span></div></div><div class="gift-grid">${GIFTS.map(g=>`<div class="gift-tile"><em>${g.emoji}</em><strong>${g.name}</strong><small>×${p.gifts[g.id]||0}</small></div>`).join('')}</div><h3>来自同学的评价</h3>${reviews.slice(0,3).map(r=>`<div class="review"><strong style="font-size:12px">${gift(r.gift).emoji} ${gift(r.gift).name}</strong><p>“${esc(r.text)}”</p><small>来自「${esc(r.task)}」 · ${relative(r.at)}</small></div>`).join('')}<div class="notice" style="margin-top:15px">所有身份、历史任务与评价均为示例。真实校园认证尚未接入。</div>${activeTask?`<div class="modal-foot"><button class="secondary" data-action="detail" data-id="${activeTask}">返回互助详情</button></div>`:''}`)}
function chatTask(id){if(!S.messages[id]){S.messages[id]=[{who:'system',text:'任务内沟通已开启。演示消息仅保存在本机，不会发送给真实同学。'}];persist()}threadId=id;close();nav('messages')}
function renderMessages(){const ids=Object.keys(S.messages).filter(id=>taskFor(id)).sort((a,b)=>(S.messages[b].at(-1)?.at||taskFor(b).created)-(S.messages[a].at(-1)?.at||taskFor(a).created));if(!threadId||!ids.includes(threadId))threadId=ids[0]||null;const t=taskFor(threadId);$('#view-messages').innerHTML=`<h1 class="page-title">消息</h1><p class="page-subtitle">把交接说清楚，让每一次帮助更安心。</p><div class="notice" style="margin-bottom:18px">交互演示：消息仅保存在本机，不会发送给真实同学。${S.notices.length?' <button data-action="readNotices">标记通知已读</button>':''}</div>${t?`<div class="msg-layout"><div class="thread-list">${ids.map(id=>{const task=taskFor(id),other=person(task.owner==='me'?(task.runner||'cat'):task.owner);return`<button class="thread ${id===threadId?'active':''}" data-action="thread" data-id="${id}"><span class="avatar">${other.avatar}</span><div><h3>${esc(other.name)}</h3><p>${esc(task.title)}</p><p>${esc(S.messages[id].at(-1)?.text||'开始沟通')}</p></div></button>`}).join('')}</div><div class="chat-area"><div class="chat-head"><span>${esc(t.title)}</span><button class="textbtn" data-action="detail" data-id="${t.id}">任务详情 →</button></div><div class="chat-bubbles" id="chatBubbles">${(S.messages[t.id]||[]).map(m=>m.who==='system'?`<div class="system-msg">${esc(m.text)}</div>`:`<div class="bubble ${m.who==='me'?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="quickreplies">${['我正好顺路，可以帮你。','到了在楼下见～','可以晚十分钟吗？'].map(txt=>`<button data-action="quickReply" data-value="${txt}">${txt}</button>`).join('')}</div><form class="chat-form" id="chatForm" data-id="${t.id}"><input id="chatInput" name="message" aria-label="聊天消息" placeholder="说清时间、地点和交接方式…" maxlength="500" required><button class="primary" style="padding:8px 17px" type="submit">发送</button></form></div></div>`:emptyBox('暂时还没有消息','接下一份互助，和同学打个招呼。')}`;if($('#chatBubbles'))$('#chatBubbles').scrollTop=$('#chatBubbles').scrollHeight}
function resetFilters(){['filterFrom','filterTo'].forEach(id=>$('#'+id).value='');$('#filterTime').value='all';$('#filterPay').value='all';$('#search').value='';$('#sort').value='new';routeMatch=null;renderCards()}
function guide(){show('两分钟，体验一次搭把手',`<div class="notice">无需注册，所有人物和任务均为示例。操作保存在当前浏览器；刷新后可以继续体验。</div><div class="help-step"><b>1</b><div><h3>看看谁刚好顺路</h3><p>在广场按分类、地点和时间筛选，或选一条自己的路线。</p></div></div><div class="help-step"><b>2</b><div><h3>接下一个小忙</h3><p>打开任务，确认费用和约定，再接单或加入拼单。</p></div></div><div class="help-step"><b>3</b><div><h3>完成交接</h3><p>标记送达，再用明确标注的「演示」按钮模拟对方确认。</p></div></div><div class="help-step"><b>4</b><div><h3>让靠谱被看见</h3><p>赠送礼物与评价，模拟收到感谢，在个人主页佩戴礼物。</p></div></div><div class="modal-foot"><button class="primary" data-action="detail" data-id="t1">从接一个快递开始 →</button><button class="secondary" data-action="guideOwn">体验发布者确认</button></div><p class="muted" style="font-size:10px;margin-top:20px">这是产品交互 Demo，未接入真实用户、支付、认证与实时定位。</p>`)}
function cancelPrompt(id){const t=taskFor(id);show(t.status==='open'?'取消这份互助':'申请取消互助',`<p class="muted" style="font-size:12px">${t.status==='open'?'取消后不再出现在可参与广场。':'请先与对方协商取消，说明原因。真实产品需要双方确认，此处仅演示取消留痕。'}</p><form id="cancelForm" data-id="${id}"><div class="field" style="margin-top:15px"><label for="cancelReason">取消原因</label><select name="reason" id="cancelReason"><option>计划有变，暂时不需要了</option><option>时间不合适，已与同学沟通</option><option>信息有误，准备重新发布</option></select></div><label style="display:flex;gap:8px;font-size:11px"><input type="checkbox" required>我已确认取消${t.status!=='open'?'并与对方协商一致':''}。</label><div class="modal-foot"><button class="primary" type="submit">确认取消</button><button type="button" class="secondary" data-action="detail" data-id="${id}">继续互助</button></div></form>`)}
function handleAction(b){const a=b.dataset.action,id=b.dataset.id,v=b.dataset.value;
switch(a){case'nav':close();nav(b.dataset.page);break;case'close':close();break;case'help':guide();break;case'publish':openPublish();break;case'editTask':editTask(id);break;case'offer':openPublish('offer');break;case'direction':direction=v;renderCards();break;case'category':category=v;renderCards();break;case'detail':openTask(id);break;case'person':openPerson(id);break;case'resetFilters':resetFilters();break;case'clearRoute':routeMatch=null;renderCards();break;
case'matchRoute':{const from=$('#routeFrom').value,to=$('#routeTo').value;if(from===to){toast('请选不同的出发地和目的地。');break}resetFilters();routeMatch={from,to};direction='need';$('#sort').value='route';renderCards();toast('已按校园地标匹配，完整路线优先。');$('#taskCards').scrollIntoView({behavior:'smooth',block:'start'});break}
case'publishDir':publishDir=v;drawPublish();break;case'publishCat':publishCat=v;drawPublish();break;case'payChoice':payChoice=v;$$('[data-action="payChoice"]').forEach(el=>el.classList.toggle('active',el.dataset.value===v));$('#feeField').classList.toggle('hidden',v!=='cash');$('#feeField input').disabled=v!=='cash';$('#feeField input').required=v==='cash';break;case'acceptPrompt':acceptPrompt(id);break;case'chat':chatTask(id);break;case'orderTab':orderTab=v;renderOrders();break;case'thread':threadId=id;renderMessages();break;case'quickReply':$('#chatInput').value=v;$('#chatInput').focus();break;case'deliver':transition(id,'delivered');break;case'demoDeliver':transition(id,'delivered',true);break;case'complete':transition(id,'completed');break;case'demoComplete':transition(id,'completed',true);break;case'startGroup':transition(id,'accepted');break;case'demoStart':transition(id,'accepted',true);break;
case'demoAccept':{const t=taskFor(id);if(!t||t.owner!=='me'||effectiveStatus(t)!=='open')break;if(t.cap){if(t.joins.length<t.cap&&!t.joins.some(j=>j.id==='cat'))t.joins.push({id:'cat',text:'【演示】同学加入了这份互助。'});if(t.joins.length>=t.cap)t.status='accepted'}else{t.runner='cat';t.status='accepted'}addMessage(id,'system','【演示】晚八点的猫参与了你的互助。');addMessage(id,'cat','【演示】我正好顺路，到时在楼下联系你～');persist();renderCurrent();openTask(id);toast('已模拟同学参与，可继续体验交接。');break}
case'leave':{const t=taskFor(id);if(!t||!joined(t))break;t.joins=t.joins.filter(j=>j.id!=='me');addMessage(id,'system','你退出了本次参与。');persist();renderCurrent();openTask(id);toast('已退出，名额已释放。');break}
case'gift':openGift(id);break;case'chooseGift':chosenGift=id;$$('[data-action="chooseGift"]').forEach(el=>el.classList.toggle('active',el.dataset.id===id));break;case'demoGift':receiveGift(id);break;case'myGifts':close();nav('profile');break;case'equip':if(!S.user.gifts[id])return toast('先完成互助，收下这份礼物吧。');S.user.equip=id;persist();renderProfile();toast('已佩戴'+gift(id).emoji+gift(id).name);break;case'cancelTask':cancelPrompt(id);break;
case'report':show('反馈交接问题',`<p class="muted" style="font-size:12px">先在任务消息中与同学核对。任务暂不自动完成。</p><form id="reportForm" data-id="${id}"><div class="field" style="margin-top:15px"><label>遇到了什么问题？</label><textarea name="issue" required maxlength="300" placeholder="描述问题并保留任务沟通记录。请勿填写敏感信息。"></textarea></div><div class="notice">演示版本仅将反馈记录在本机，未接入客服处理或退款服务。</div><div class="modal-foot"><button type="submit" class="primary">保存反馈</button><button type="button" class="secondary" data-action="chat" data-id="${id}">先联系同学</button></div></form>`);break;
case'editProfile':show('换个校园昵称',`<form id="profileForm"><div class="field"><label for="nick">昵称</label><input id="nick" name="nickname" value="${esc(S.user.name)}" maxlength="12" required></div><div class="field"><label>头像</label><select name="avatar">${['🐣','🐻','🐰','🦊','🐱','🌱','🐼','🐸'].map(x=>`<option ${S.user.avatar===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="notice">半匿名交流：公开展示昵称，履约和礼物始终积累在同一个账号。</div><div class="modal-foot"><button class="primary full" type="submit">保存昵称</button></div></form>`);break;
case'school':show('我的校园',`<div class="notice">目前展示示例大学的地标和任务。校园认证与跨校切换尚未接入。</div><h3>📍 ${esc(S.school)}</h3><p class="muted" style="font-size:12px">以校园地标寻找顺路互助，不读取或跟踪你的实时位置。</p><div class="modal-foot"><button class="primary" data-action="close">了解了</button></div>`);break;
case'guideOwn':close();orderTab='all';nav('orders');openTask('mine1');break;case'readNotices':S.notices=[];persist();summary();renderMessages();toast('通知已读');break;
case'about':show('关于这个 Demo',`<h3 style="margin-top:0">搭把手 · 校园顺路互助</h3><p class="detail-description">围绕同校信任、顺路匹配与轻量反馈设计。保留微信群的人情味，把路线、时间、履约和感谢组织起来。</p><div class="notice" style="margin-top:15px">这是独立 HTML 产品雏形，全部人物、身份和历史任务均为示例。新操作保存在当前浏览器，不会同步给其他访客。未接入真实账号、认证、支付、地图或消息服务。</div><h3>可体验的功能</h3><p class="detail-description">发布需求与顺路邀请；分类、关键词、地点和时间筛选；代取接单、拼单加入、旧书预约；消息留痕；完成确认、赠礼、收到感谢与主页佩戴。</p><div class="modal-foot"><button class="primary" data-action="help">体验指南</button><button class="secondary" data-action="resetPrompt">重置示例数据</button></div>`);break;
case'resetPrompt':show('重置这次体验？',`<p class="detail-description">将清除本机新增的任务、消息与礼物，恢复初始示例。此操作无法撤销。</p><div class="modal-foot"><button class="primary" data-action="resetAll">确认重置</button><button class="secondary" data-action="close">保留进度</button></div>`);break;case'resetAll':S=fresh();persist();direction='need';category='all';orderTab='all';threadId=null;activeTask=null;resetFilters();close();nav('home');toast('已恢复示例数据。');break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='publishForm')submitPublish(f);if(f.id==='acceptForm')acceptSubmit(f);if(f.id==='giftForm')giftSubmit(f);if(f.id==='chatForm'){const text=new FormData(f).get('message').trim();if(!text)return;addMessage(f.dataset.id,'me',text);persist();renderMessages();$('#chatInput')?.focus()}if(f.id==='profileForm'){const d=new FormData(f),name=d.get('nickname').trim();if(!name)return;S.user.name=name;S.user.avatar=d.get('avatar');persist();close();renderCurrent();toast('昵称已更新，信用记录继续积累。')}if(f.id==='cancelForm'){const t=taskFor(f.dataset.id);if(!t||!['open','accepted'].includes(t.status))return;t.status='cancelled';t.cancelReason=new FormData(f).get('reason');addMessage(t.id,'system','互助已取消：'+t.cancelReason);persist();renderCurrent();openTask(t.id);toast('已取消并记录原因。')}if(f.id==='reportForm'){const text=new FormData(f).get('issue').trim();if(!text)return;addMessage(f.dataset.id,'system','【问题反馈 · 仅本机保存】'+text);persist();openTask(f.dataset.id);toast('反馈已保存在任务记录中，尚未提交真实客服。')}});
$('#search').addEventListener('input',renderCards);['filterFrom','filterTo','filterTime','filterPay','sort'].forEach(id=>$('#'+id).addEventListener('change',renderCards));$('#filterFrom').innerHTML=selectOptions('','不限起点');$('#filterTo').innerHTML=selectOptions('','不限终点');$('#routeFrom').innerHTML=selectOptions('东门快递站');$('#routeTo').innerHTML=selectOptions('图书馆');['routeFrom','routeTo'].forEach(id=>$('#'+id).addEventListener('change',()=>{$('#mapFrom').textContent=$('#routeFrom').value;$('#mapTo').textContent=$('#routeTo').value}));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
persist();renderCurrent();setInterval(()=>{if(page==='home'&&!$('#modal').open)renderCards()},60000);
</script>
</body></html>
